function grab(){var o={};ks().forEach(function(k){if(!SK.test(k))o[k]=R.getItem(P+k)});return o}
function say(t,c){if(el){el.textContent='\\uD83E\\uDDED Vone sync: '+t;el.style.borderColor=c||'#888'}}
function idb(){return new Promise(function(res,rej){var q=indexedDB.open('vone-agent',1);q.onupgradeneeded=function(){q.result.createObjectStore('h')};q.onsuccess=function(){res(q.result)};q.onerror=function(){rej()}})}
async function hget(){try{var db=await idb();return await new Promise(function(r){var q=db.transaction('h').objectStore('h').get(ID);q.onsuccess=function(){r(q.result)};q.onerror=function(){r(null)}})}catch(e){return null}}
async function hput(h){try{var db=await idb();db.transaction('h','readwrite').objectStore('h').put(h,ID)}catch(e){}}
async function readF(){try{var f=await(await d.getFileHandle('data.json')).getFile();return JSON.parse(await f.text())}catch(e){return null}}
async function writeF(){var w=await(await d.getFileHandle('data.json',{create:true})).createWritable();await w.write(JSON.stringify({v:1,app:NAME,id:ID,at:meta.at,data:grab()}));await w.close()}
function applyF(F){ks().forEach(function(k){if(!SK.test(k))R.removeItem(P+k)});Object.keys(F.data).forEach(function(k){if(!SK.test(k))R.setItem(P+k,F.data[k])});meta={at:F.at,sig:JSON.stringify(grab()),q:Date.now()+3000};sv()}
async function tick(){if(!d)return;try{var F=await readF(),has=F&&F.data&&Object.keys(F.data).length,sig=JSON.stringify(grab());
 if(meta.at===undefined){if(has){applyF(F);return location.reload()}meta={at:0,sig:''}}
 if(meta.q&&Date.now()<meta.q){if(meta.sig!==sig){meta.sig=sig;sv()}return}
 if(meta.sig!==sig){meta.at=Date.now();meta.sig=sig;sv();await writeF();say('synced '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),'#16a34a');return}
 if(has&&F.at>(meta.at||0)){applyF(F);location.reload()}}catch(e){say('click to reconnect','#dc2626');d=null;el.onclick=boot}}
function loop(){say('synced','#16a34a');tick();if(!run)run=setInterval(tick,1000)}
async function connect(){try{var root=await showDirectoryPicker({mode:'readwrite'}),x=root;if(root.name===BK)x=await root.getDirectoryHandle(DIR,{create:true});else if(root.name!==DIR){var b=await root.getDirectoryHandle(BK);x=await b.getDirectoryHandle(DIR,{create:true})}d=x;await hput(d);loop()}catch(e){say(e.name==='NotFoundError'?'pick the Vone master folder':'not connected','#dc2626')}}
async function boot(){if(!('showDirectoryPicker' in window)){say('folder access is not available in this browser','#d97706');return}
 d=await hget();if(d&&d.getFileHandle){var p=d.queryPermission?await d.queryPermission({mode:'readwrite'}):'granted';if(p==='granted')return loop();say('click to reconnect','#d97706');el.onclick=async function(){if(!d.requestPermission||await d.requestPermission({mode:'readwrite'})==='granted')loop()};return}
 d=null;say('click to connect to the Vone folder','#d97706');el.onclick=connect}
function ui(){el=document.createElement('div');el.style.cssText='position:fixed;left:10px;bottom:10px;z-index:2147483647;font:12px system-ui,sans-serif;background:#fff;color:#222;border:2px solid #888;border-radius:20px;padding:5px 11px;cursor:pointer;box-shadow:0 2px 10px #0004;opacity:.92';el.title='Keeps this page in sync with Vone through the shared backup folder';document.body.appendChild(el);boot()}
if(document.body)ui();else document.addEventListener('DOMContentLoaded',ui)})(${JSON.stringify([a.id,a.dir,a.name])});`;

async function openApp(id){const prev=TAB;if(prev!==id&&prev!=='home')setVis(prev,false);TAB=id;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('a',b.dataset.i===id));document.querySelectorAll('.pane').forEach(p=>p.classList.remove('a'));
 if(id==='home'){$('#home').classList.add('a');return}const a=byId(id);if(!a)return openApp('home');let p=document.getElementById('p_'+id);const existed=!!p;
 if(!p){p=document.createElement('div');p.className='pane';p.id='p_'+id;
  if(a.kind==='link'){p.innerHTML=`<div class="lbar"><span>${esc(a.url)} — the app must be running at this address</span><a href="${esc(a.url)}" target="_blank" rel="noopener">Open in new tab ↗</a></div><iframe src="${esc(a.url)}"></iframe>`}
  else{const h=await getHtml(a);if(!h){toast('App file missing — use ⚙ → Replace HTML');return openApp('home')}p.innerHTML='<iframe></iframe>';p.firstChild.srcdoc=inject(h,id)}
  $('#mn').appendChild(p)}

function render(){
 $('#nav').innerHTML=`<button data-i="home">🏠 Home</button>`+REG.apps.map(a=>`<button data-i="${a.id}">${esc(a.icon||'')} ${esc(a.name)}</button>`).join('');
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('a',b.dataset.i===TAB));
 const ic=a=>a.icon?esc(a.icon):esc(a.name[0].toUpperCase());

 else if(!linked)note=`<div class="note"><h3>Step 1 — choose your Vone master folder</h3><p>Pick any folder. Vone creates <code>${NA}</code> (your app files) and <code>${NB}</code> (one backup folder per app) inside it. If you already created these two folders, pick the folder that contains them.</p><button class="btn p" id="nLink">${needPerm?'Reconnect folder':'Choose master folder'}</button></div>`;
 $('#home').innerHTML=`<div class="wrap"><div class="hero">${logo('lb')}<div><h1><span>Vone</span></h1><div class="mu">All your apps, one roof.</div></div></div>${note}
 <div class="grid">${REG.apps.map(a=>`<div class="card" data-o="${a.id}"><button class="gear" data-g="${a.id}" title="Manage">⚙</button>${a.kind==='html'?`<button class="gear" data-w="${a.id}" style="right:36px" title="Open in its own tab (stays in sync with Vone)">↗</button>`:''}<div class="ic">${ic(a)}</div><b>${esc(a.name)}</b><small>${a.kind==='link'?'Web link':last[a.id]?'Backed up '+last[a.id]:linked?'Backup folder ready':'Stored in browser'}</small></div>`).join('')}
 <div class="card add" id="cAdd"><div class="ic">＋</div><b>Add app</b></div></div></div>`;
 const n=$('#nLink');if(n)n.onclick=()=>needPerm?reconnect():linkFolder()}
$('#nav').onclick=e=>{const i=e.target.closest('button')?.dataset.i;if(i)openApp(i)};
$('#home-b').onclick=()=>openApp('home');
$('#home').onclick=e=>{const w=e.target.closest('[data-w]');if(w)return openOwn(byId(w.dataset.w));const g=e.target.closest('[data-g]');if(g)return manage(g.dataset.g);const o=e.target.closest('[data-o]');if(o)return openApp(o.dataset.o);if(e.target.closest('#cAdd'))addDialog()};
const pops=['#pTheme','#pSync'];const closePops=()=>pops.forEach(p=>$(p).classList.remove('o'));
$('#bTheme').onclick=e=>{e.stopPropagation();const o=$('#pTheme').classList.contains('o');closePops();if(!o)$('#pTheme').classList.add('o')};
$('#bSync').onclick=e=>{e.stopPropagation();const o=$('#pSync').classList.contains('o');closePops();if(!o){syncPanel();$('#pSync').classList.add('o')}};
document.addEventListener('click',e=>{if(!e.composedPath().some(n=>n.classList&&n.classList.contains('pop')))closePops()});
async function reconnect(){if(ROOT&&await perm(ROOT,true)){try{await mount(ROOT);await bootDisk(false);render();toast('Reconnected ✓')}catch(e){toast('Reconnect failed')}}else linkFolder()}
const UA=navigator.userAgent,BR=/Firefox/.test(UA)?'Firefox':/Edg\//.test(UA)?'Edge':/Ulaa/i.test(UA)?'Ulaa':/Chrome/.test(UA)?'Chromium-based browser':'this browser';
function syncPanel(){$('#pSync').innerHTML=`<h3>Master folder &amp; backup</h3><p>Folder access in ${BR}: <b style="color:var(--${FSA?'ok':'er'})">${FSA?'available ✓':'not available ✗'}</b>${FSA?'':BR==='Firefox'?'<br>Firefox cannot write to folders from a web page. Use Export / Import below, or a Chromium browser.':'<br>This browser has the folder feature switched off. Look for “File System Access” on its flags page, or use Export / Import below.'}</p><p>${linked?`Linked: <b>${esc(ROOT.name)}</b><br>📁 ${NA} — app files<br>📁 ${NB} — a folder per app`:'Not linked yet.'}</p>
 ${FSA?`<button class="btn p" id="s1">${linked?'Change master folder…':needPerm?'Reconnect folder':'Choose master folder…'}</button>${linked?'<button class="btn" id="s2">⟳ Back up everything now</button>':''}${needPerm?'<button class="btn" id="s5">🔓 Reconnect</button>':''}`:'<p><b>Folder access not available here.</b></p>'}
 <button class="btn" id="s3">⬇ Export all apps + data (one file)</button><button class="btn" id="s4">📂 Import an export…</button><input type="file" id="sf" accept=".json" hidden>
 <p><b>Standalone copy:</b> on the Home screen, press <b>↗</b> on an app card to open it in its own tab, already connected to its backup folder.</p><p>Add or remove an app in Vone and its file and backup folder are added to / removed from the master folders too.</p>`;
 const q=x=>$('#pSync '+x);if(q('#s1'))q('#s1').onclick=()=>needPerm?reconnect():linkFolder();if(q('#s5'))q('#s5').onclick=reconnect;if(q('#s2'))q('#s2').onclick=async()=>{scan();htmlApps().forEach(a=>{if(META[a.id])dirty.add(a.id)});await pushAll();closePops()};
 q('#s3').onclick=exportAll;q('#s4').onclick=()=>q('#sf').click();q('#sf').onchange=importAll}
async function exportAll(){scan();const o={v:1,app:'vone',apps:[]};for(const a of REG.apps){const e={...a};if(a.kind==='html'){e.html=await getHtml(a);e.data=grab(a.id)}o.apps.push(e)}dl('vone-export.json',o);toast('Exported ✓')}
async function importAll(e){const f=e.target.files[0];e.target.value='';if(!f)return;try{const o=JSON.parse(await f.text());if(!Array.isArray(o.apps))throw 0;if(!confirm(`Import ${o.apps.length} app(s)? Apps with the same name are replaced.`))return;
 for(const x of o.apps){const old=REG.apps.find(a=>a.name===x.name);if(old)await removeApp(old,{disk:false,final:false,quiet:true});const a={id:uid(),kind:x.kind,name:x.name,icon:x.icon||''};
  if(x.kind==='link')a.url=x.url;else{a.dir=uniq(safe(x.name));a.file=a.dir+'.html';if(linked){await toDisk(a,x.html||'');await bdir(a);dirty.add(a.id)}await xPut(a.id,{html:strip(x.html||''),mt:Date.now()});apply(a.id,x.data||{})}REG.apps.push(a)}
 saveReg();render();if(dirty.size)queue();toast('Imported ✓')}catch(x){toast('Not a valid Vone export')}}
async function openOwn(a){if(!a)return;const h=await getHtml(a);if(!h)return toast('App file missing');
 if(linked){try{const d=await bdir(a),db=await new Promise((res,rej)=>{const q=indexedDB.open('vone-agent',1);q.onupgradeneeded=()=>q.result.createObjectStore('h');q.onsuccess=()=>res(q.result);q.onerror=rej});await new Promise(res=>{const t=db.transaction('h','readwrite');t.objectStore('h').put(d,a.id);t.oncomplete=res;t.onerror=res})}catch(e){}}
 const w=window.open('','_blank');if(!w)return toast('Pop-up blocked — allow pop-ups for this page');
 w.document.open();w.document.write(withAgent(h,a));w.document.close();w.document.title=a.name}
/* ---------- add / manage / remove ---------- */
function modal(inner){const m=document.createElement('div');m.className='md';m.innerHTML=`<div class="mb">${inner}</div>`;m.onclick=e=>{if(e.target===m)m.remove()};document.body.appendChild(m);return m}
function addDialog(){let kind='html',file=null;const m=modal(`<h3>Add an app</h3><div class="seg" id="ak"><button data-k="html" class="on">HTML file</button><button data-k="link">Web link</button></div>
 <div id="kh"><label>Upload the app's .html file</label><input type="file" id="af" accept=".html,.htm,text/html"></div>
 <div id="kl" hidden><label>Address (e.g. your Reminder Bot)</label><input id="au" placeholder="http://localhost:8765"></div>
 <label>Name</label><input id="an" placeholder="e.g. FitVijay"><label>Icon (emoji, optional)</label><input id="ai" maxlength="2" placeholder="💪">
 <p id="ah"></p><div class="bt"><button class="btn" id="ax">Cancel</button><button class="btn p" id="ao">Add app</button></div>`);
 const q=s=>m.querySelector(s),hint=()=>{q('#ah').textContent=kind==='link'?'Opens inside Vone. A link has no file or backup folder here — the app keeps its own data.':linked?`Saved to “${NA}/${safe(q('#an').value||'name')}.html” and a folder “${NB}/${safe(q('#an').value||'name')}” is created for its backup.`:'Saved in this browser. Link the master folder to also store it on disk.'};hint();
 q('#ak').onclick=e=>{const k=e.target.dataset.k;if(!k)return;kind=k;q('#ak').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));q('#kh').hidden=k!=='html';q('#kl').hidden=k!=='link';hint()};
 q('#af').onchange=async e=>{file=e.target.files[0];if(!file)return;const t=await file.text(),mm=t.match(/<title[^>]*>([^<]*)<\/title>/i);if(!q('#an').value)q('#an').value=(mm&&mm[1].trim())||file.name.replace(/\.html?$/i,'');hint()};q('#an').oninput=hint;
 q('#ax').onclick=()=>m.remove();
 q('#ao').onclick=async()=>{const name=q('#an').value.trim();if(!name)return toast('Enter a name');const icon=q('#ai').value.trim();
  try{const a={id:uid(),kind,name,icon};
   if(kind==='link'){let u=q('#au').value.trim();if(!/^https?:\/\//i.test(u))return toast('Enter an address starting with http://');a.url=u}
   else{if(!file)return toast('Choose an .html file');a.dir=uniq(safe(name));a.file=a.dir+'.html';const html=await file.text();if(linked){await toDisk(a,html);await bdir(a)}await xPut(a.id,{html:strip(html),mt:Date.now()})}
   REG.apps.push(a);saveReg();m.remove();render();openApp(a.id);toast(name+' added ✓')}catch(e){toast('Could not add app: '+(e.message||e))}}}
function manage(id){const a=byId(id);if(!a)return;const m=modal(`<h3>${esc(a.icon)} ${esc(a.name)}</h3><p>${a.kind==='link'?esc(a.url):linked?`📄 ${NA}/${esc(a.file)}<br>📁 ${NB}/${esc(a.dir)}`:'Stored in this browser only.'}</p>${a.kind==='html'&&linked?`<p>Opening <code>${esc(a.file)}</code> straight from the folder also works: click the <b>🧭 Vone sync</b> pill at the bottom-left of <i>that</i> page (not in Vone) and pick the master folder once.</p>`:''}
 ${a.kind==='html'?`<button class="btn p" id="mo">↗ Open in its own tab (live sync with Vone)</button><button class="btn" id="mr">📄 Replace HTML file…</button>${linked?'<button class="btn" id="mb">⟳ Back up now</button><button class="btn" id="mt">⟲ Restore from backup folder</button>':''}<input type="file" id="mf" accept=".html,.htm" hidden>`:''}
 <button class="btn d" id="md">🗑 Remove app…</button><div class="bt"><button class="btn" id="mx">Close</button></div>`);const q=s=>m.querySelector(s);
 q('#mx').onclick=()=>m.remove();
 if(a.kind==='html'){q('#mo').onclick=()=>{m.remove();openOwn(a)};q('#mr').onclick=()=>q('#mf').click();q('#mf').onchange=async e=>{const f=e.target.files[0];if(!f)return;const html=await f.text();if(linked)await toDisk(a,html);await xPut(a.id,{html:strip(html),mt:Date.now()});reloadApp(a.id);m.remove();toast('HTML replaced ✓')};
  if(linked){q('#mb').onclick=async()=>{scan();dirty.add(a.id);await pushAll();m.remove()};q('#mt').onclick=async()=>{if(!confirm('Replace '+a.name+"'s current data with the backup folder copy?"))return;const f=await rfile(await bdir(a),'data.json');if(!f)return toast('No backup yet');try{const F=JSON.parse(await f.text());apply(a.id,F.data,F.at);reloadApp(a.id);m.remove();toast('Restored ✓')}catch(e){toast('Backup file unreadable')}}}}
 q('#md').onclick=()=>{m.remove();removeDialog(a)}}
function removeDialog(a){const m=modal(`<h3>Remove ${esc(a.name)}?</h3><p>This removes the app from Vone.</p>${a.kind==='html'?`<label class="ck"><input type="checkbox" id="rd" ${linked?'checked':'disabled'}><span>Also delete <code>${NA}/${esc(a.file)}</code> and the whole backup folder <code>${NB}/${esc(a.dir)}</code> from my computer</span></label><label class="ck"><input type="checkbox" id="rf" checked><span>Download a last copy of its data first</span></label>`:''}<div class="bt"><button class="btn" id="rx">Cancel</button><button class="btn p" id="ro" style="background:var(--er)">Remove</button></div>`);
 m.querySelector('#rx').onclick=()=>m.remove();m.querySelector('#ro').onclick=async()=>{const disk=!!m.querySelector('#rd')?.checked,fin=!!m.querySelector('#rf')?.checked;m.remove();await removeApp(a,{disk,final:fin})}}
async function removeApp(a,{disk,final,quiet}){try{
 if(a.kind==='html'){if(final){scan();dl(`vone-${safe(a.name)}-final-backup.json`,{app:a.name,html:await getHtml(a),data:grab(a.id)})}
  if(disk&&linked){await DA.removeEntry(a.file).catch(()=>{});await DBK.removeEntry(a.dir,{recursive:true}).catch(()=>{})}
  const p=pre(a.id);[...Array(LS.length).keys()].map(i=>LS.key(i)).filter(k=>k.startsWith(p)).forEach(k=>LS.removeItem(k));await xDel(a.id);delete META[a.id];saveMeta();dirty.delete(a.id)}
 document.getElementById('p_'+a.id)?.remove();REG.apps=REG.apps.filter(x=>x.id!==a.id);saveReg();if(TAB===a.id)TAB='home';render();openApp(TAB);if(!quiet)toast(a.name+' removed')}catch(e){toast('Remove failed: '+(e.message||e))}}
